<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyCraft</title>

<meta name="theme-color" content="#2874F0">

<style>
:root{
 --primary:#2874F0;
 --bg:#f4f6f8;
 --dark:#121212;
}
body{
 margin:0;
 font-family:Arial, sans-serif;
 background:var(--bg);
}
header{
 background:var(--primary);
 color:#fff;
 padding:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
header span{
 font-size:18px;
}
button{
 background:var(--primary);
 color:#fff;
 border:none;
 padding:6px 10px;
 border-radius:6px;
}
.card{
 background:#fff;
 margin:10px;
 padding:12px;
 border-radius:10px;
}
.nav{
 position:fixed;
 bottom:0;
 width:100%;
 background:#fff;
 display:flex;
 justify-content:space-around;
 padding:8px 0;
}
.nav button{
 background:none;
 color:#333;
}
.hidden{display:none;}
.dark{
 background:var(--dark);
 color:#fff;
}
.dark .card{background:#1f1f1f;}
</style>
</head>

<body id="app">

<header>
 <span>BuyCraft</span>
 <div>
   <button onclick="toggleLang()">🌐</button>
   <button onclick="toggleDark()">🌙</button>
 </div>
</header>

<!-- HOME -->
<div id="home">
 <div class="card">
   <h3 id="deal">Big Deals</h3>
   <p>Smartphone – ₹14999</p>
   <button onclick="addCart('Smartphone',14999)">Add to Cart</button>
 </div>
 <div class="card">
   <p>Shoes – ₹2499</p>
   <button onclick="addCart('Shoes',2499)">Add to Cart</button>
 </div>
</div>

<!-- CART -->
<div id="cart" class="hidden">
 <div class="card">
   <h3>My Cart</h3>
   <ul id="cartList"></ul>
   <p><b>Total: ₹<span id="total">0</span></b></p>
   <button onclick="checkout()">Checkout</button>
 </div>
</div>

<!-- CHECKOUT -->
<div id="checkout" class="hidden">
 <div class="card">
   <h3>Order Confirmed 🎉</h3>
   <p>Payment: Cash on Delivery</p>
   <button onclick="goHome()">Continue Shopping</button>
 </div>
</div>

<footer class="card" style="text-align:center;margin-bottom:70px">
 BuyCraft © 2025<br>Owner: Adi
</footer>

<!-- NAV -->
<div class="nav">
 <button onclick="show('home')">🏠 Home</button>
 <button onclick="show('cart')">🛒 Cart (<span id="count">0</span>)</button>
</div>

<script>
let cart=[];
let lang="en";
function addCart(name,price){
 cart.push({name,price});
 updateCart();
}
function updateCart(){
 let list=document.getElementById("cartList");
 list.innerHTML="";
 let total=0;
 cart.forEach((i,idx)=>{
  total+=i.price;
  list.innerHTML+=`<li>${i.name} - ₹${i.price}
  <button onclick="remove(${idx})">❌</button></li>`;
 });
 document.getElementById("total").innerText=total;
 document.getElementById("count").innerText=cart.length;
}
function remove(i){
 cart.splice(i,1);
 updateCart();
}
function show(id){
 ["home","cart","checkout"].forEach(x=>{
  document.getElementById(x).classList.add("hidden");
 });
 document.getElementById(id).classList.remove("hidden");
}
function checkout(){
 show("checkout");
 cart=[];
 updateCart();
}
function goHome(){
 show("home");
}
function toggleDark(){
 document.getElementById("app").classList.toggle("dark");
}
function toggleLang(){
 lang = lang==="en"?"hi":"en";
 document.getElementById("deal").innerText =
  lang==="en"?"Big Deals":"बड़े ऑफर";
}
</script>

</body>
</html>
