<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyCraft</title>

<meta name="theme-color" content="#2874F0">

<style>
:root{
 --primary:#2874F0;
 --accent:#ff9f00;
 --bg:#f1f3f6;
 --card:#ffffff;
 --dark:#121212;
}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
 background:var(--bg);
}
.dark{
 background:var(--dark);
 color:#fff;
}
header{
 background:var(--primary);
 color:#fff;
 padding:14px;
 font-size:20px;
 font-weight:600;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.actions button{
 background:rgba(255,255,255,0.2);
 border:none;
 color:#fff;
 padding:6px 10px;
 border-radius:8px;
 margin-left:6px;
}
.banner{
 margin:12px;
 padding:20px;
 border-radius:16px;
 background:linear-gradient(135deg,#2874F0,#6a11cb);
 color:#fff;
 font-size:22px;
 font-weight:600;
}
.section{
 margin:12px;
 font-weight:600;
}
.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 padding:12px;
}
.card{
 background:var(--card);
 border-radius:14px;
 padding:10px;
 box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.dark .card{background:#1f1f1f;}
.card img{
 width:100%;
 border-radius:12px;
}
.card h4{
 margin:8px 0 4px;
 font-size:14px;
}
.price{
 font-weight:700;
 color:#2e7d32;
}
button.buy{
 width:100%;
 margin-top:6px;
 background:var(--accent);
 border:none;
 padding:8px;
 border-radius:8px;
 color:#000;
 font-weight:600;
}
.nav{
 position:fixed;
 bottom:0;
 width:100%;
 background:#fff;
 display:flex;
 justify-content:space-around;
 padding:8px 0;
 box-shadow:0 -2px 8px rgba(0,0,0,0.15);
}
.dark .nav{background:#1f1f1f;}
.nav button{
 background:none;
 border:none;
 font-size:14px;
}
.hidden{display:none;}
.cartBox{
 margin:12px;
}
</style>
</head>

<body id="app">

<header>
 <div>BuyCraft</div>
 <div class="actions">
  <button onclick="toggleLang()">🌐</button>
  <button onclick="toggleDark()">🌙</button>
 </div>
</header>

<!-- HOME -->
<div id="home">
 <div class="banner" id="deal">Big Festive Deals</div>

 <div class="section">Featured Products</div>
 <div class="products">
  <div class="card">
   <img src="https://via.placeholder.com/300x200">
   <h4>Smartphone</h4>
   <div class="price">₹14,999</div>
   <button class="buy" onclick="addCart('Smartphone',14999)">Add to Cart</button>
  </div>
  <div class="card">
   <img src="https://via.placeholder.com/300x200">
   <h4>Shoes</h4>
   <div class="price">₹2,499</div>
   <button class="buy" onclick="addCart('Shoes',2499)">Add to Cart</button>
  </div>
 </div>
</div>

<!-- CART -->
<div id="cart" class="hidden">
 <div class="cartBox card">
  <h3>My Cart</h3>
  <ul id="cartList"></ul>
  <p><b>Total: ₹<span id="total">0</span></b></p>
  <button class="buy" onclick="checkout()">Place Order</button>
 </div>
</div>

<!-- CHECKOUT -->
<div id="checkout" class="hidden">
 <div class="card" style="margin:12px;text-align:center">
  <h2>Order Successful 🎉</h2>
  <p>Payment: Cash on Delivery</p>
  <button class="buy" onclick="goHome()">Continue Shopping</button>
 </div>
</div>

<footer class="card" style="margin:80px 12px 90px;text-align:center">
 BuyCraft © 2025<br>Owner: Adi
</footer>

<!-- NAV -->
<div class="nav">
 <button onclick="show('home')">🏠 Home</button>
 <button onclick="show('cart')">🛒 Cart (<span id="count">0</span>)</button>
</div>

<script>
let cart=[];
let lang="en";
function addCart(n,p){
 cart.push({n,p});
 updateCart();
}
function updateCart(){
 let l=document.getElementById("cartList");
 l.innerHTML="";
 let t=0;
 cart.forEach((i,x)=>{
  t+=i.p;
  l.innerHTML+=`<li>${i.n} - ₹${i.p}
  <button onclick="remove(${x})">❌</button></li>`;
 });
 document.getElementById("total").innerText=t;
 document.getElementById("count").innerText=cart.length;
}
function remove(i){cart.splice(i,1);updateCart();}
function show(id){
 ["home","cart","checkout"].forEach(x=>{
  document.getElementById(x).classList.add("hidden");
 });
 document.getElementById(id).classList.remove("hidden");
}
function checkout(){show("checkout");cart=[];updateCart();}
function goHome(){show("home");}
function toggleDark(){document.getElementById("app").classList.toggle("dark");}
function toggleLang(){
 lang=lang==="en"?"hi":"en";
 document.getElementById("deal").innerText=
 lang==="en"?"Big Festive Deals":"बड़े त्योहार ऑफर";
}
</script>

</body>
</html>
